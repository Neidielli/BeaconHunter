[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beaconhunter"
version = "1.0.0"
description = "PCAP Network Forensics & C2 Beaconing Threat Hunting Engine mapped to MITRE ATT&CK"
readme = "README.md"
authors = [{ name = "Neidielli Rosado", email = "neidalves23@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
]

[project.scripts]
beaconhunter = "beaconhunter.cli:app"

[project.urls]
Homepage = "https://github.com/Neidielli/BeaconHunter"
Repository = "https://github.com/Neidielli/BeaconHunter.git"
